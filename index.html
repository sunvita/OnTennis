<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tennis Draw Builder</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12296b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tennis Draw">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<script src="config.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--navy:#12296b;--bg:#f4f6fa;--card:#fff;--line:#dfe4ee;--txt:#1b2333;--mut:#65708a;--acc:#1f5fd6;--grn:#2e8b1e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 20px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;font-weight:700;flex:1}
.cloudbtn{background:transparent;border:1px solid #ffffff66;color:#fff;border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.login{max-width:380px;margin:60px auto}
.login .row>label{min-width:90px}
.cloudbtn.err{border-color:#ffb4a9;color:#ffd9d3}
.lang{display:flex;border:1px solid #ffffff66;border-radius:8px;overflow:hidden}
.lang button{background:transparent;color:#fff;border:0;padding:6px 14px;font:inherit;cursor:pointer}
.lang button.on{background:#fff;color:var(--navy);font-weight:700}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.steps{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.steps button{flex:1;min-width:130px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;cursor:pointer;color:var(--mut);text-align:left}
.steps button b{display:block;color:var(--txt);font-weight:700}
.steps button.on{border-color:var(--acc);box-shadow:0 0 0 2px #1f5fd633}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:17px}
.hint{color:var(--mut);font-size:13px;margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.row>label{min-width:150px;font-weight:500}
button.btn,.seg button{font:inherit;cursor:pointer}
.btn{background:#fff;border:1px solid #b8c1d6;border-radius:8px;padding:8px 14px}
.btn:hover{background:#f0f3fa}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.btn.pri:hover{background:#1a3a8f}
.seg{display:inline-flex;border:1px solid #b8c1d6;border-radius:8px;overflow:hidden}
.seg button{background:#fff;border:0;padding:7px 14px;border-right:1px solid #b8c1d6}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc);color:#fff}
.stp{display:inline-flex;align-items:center;gap:10px}
.stp button{width:30px;height:30px;border:1px solid #b8c1d6;background:#fff;border-radius:8px;font-size:16px;cursor:pointer}
.stp span{min-width:24px;text-align:center;font-weight:700}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.p{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:#fff}
.p.on{background:#e8f0fe;border-color:#8fb0f2}
.p:not(.on){opacity:.55}
.p.early{background:#ffe9bf;border-color:#f0a531}
.p.early select.tsel{font-weight:700;color:#9a4a00;border-color:#f0a531;background:#fff6e2}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700}
.chip.early{background:#ffe9bf;color:#9a4a00;border:1px solid #f0a531}
.chip.later{background:#e8f0fe;color:#1f3fc0;border:1px solid #8fb0f2}
.p .nm{flex:1;min-width:90px;font-weight:500}
.p select{border:1px solid var(--line);border-radius:6px;padding:2px;font:inherit;font-size:13px}
.p .x{border:0;background:transparent;color:var(--mut);cursor:pointer;font-size:16px}
input[type=text]{border:1px solid #b8c1d6;border-radius:8px;padding:8px 10px;font:inherit}
.tg{display:inline-block;position:relative;width:38px;height:22px;border-radius:11px;background:#c5cce0;cursor:pointer;border:0;padding:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.tg.on{background:var(--acc)}.tg.on::after{left:19px}
table.av{border-collapse:collapse}
table.av th,table.av td{border:1px solid var(--line);padding:6px 12px;text-align:center}
table.av th{background:#f0f3fa;font-weight:500}
.note{font-size:13px;color:var(--mut)}
.err{color:#b3261e;font-size:13px}
.nav{display:flex;justify-content:space-between;margin-top:8px}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
table.st{border-collapse:collapse;width:100%}
table.st th,table.st td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:center}
table.st td:nth-child(2),table.st th:nth-child(2){text-align:left}
.scaler{transform-origin:top left;width:920px}
.sheetbox{overflow:hidden;margin-bottom:14px}

/* ---- sheet ---- */
.sheet{width:920px;background:#fff;border:3px solid var(--navy);border-radius:14px;padding:10px 12px 12px;font-family:'Noto Sans KR',sans-serif;color:#111}
.sh-head{display:flex;align-items:center;justify-content:space-between;height:150px}
.sh-head img{height:140px;width:auto}
.sh-tb{text-align:center;flex:1}
.sh-title{font-size:64px;font-weight:900;color:var(--navy);line-height:1.05;letter-spacing:2px}
.sh-sub{font-size:28px;font-weight:700;color:var(--grn);margin-top:6px}
.sh-info{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px;margin:8px 0;align-items:stretch}
.sh-info .lab{background:var(--navy);color:#fff;font-weight:700;font-size:20px;border-radius:10px;padding:0 16px;display:flex;align-items:center;justify-content:center;text-align:center}
.sh-info .box{border:2px solid var(--navy);border-radius:10px;padding:8px 12px;font-size:16px;font-weight:500;display:flex;align-items:center;line-height:1.5}
.sh-grid{display:grid;gap:4px;margin-top:8px}
.sh-grid>div{border-radius:4px}
.hc{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;height:52px}
.h0{background:var(--navy);color:#fff}
.hr{background:#fbeeb0;color:#5c4a05}
.rc{background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:108px}
.rc b{font-size:38px;font-weight:900;line-height:1}
.rc span{font-size:15px;margin-top:4px;letter-spacing:1px}
.mc{border:1.5px solid var(--navy);background:#fff;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;min-height:108px}
.mc.off{background:#e3e6ec;border-color:#b6bccb}
.tm{font-size:15px;font-weight:700;text-align:center;line-height:1.35;white-space:nowrap;width:100%;overflow:hidden}
.tm i{color:#1f3fc0;font-style:normal;font-weight:900;margin:0 .3em}
.scr{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:#1f3fc0}
.mc.off .scr{color:#8a91a3}
.scr input{width:54px;height:30px;border:1.5px solid #1f3fc0;border-radius:5px;text-align:center;font:700 16px 'Noto Sans KR',sans-serif;color:#111;background:#fff;padding:0}
.mc.off .scr input{border-color:#b6bccb;background:#eef0f4}
.rs{background:#fdf3c5;border:1.5px solid #e3d48a;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;text-align:center;padding:4px}
.sh-foot{margin-top:10px;border:2px solid var(--navy);border-radius:12px;display:flex;align-items:center;padding:8px 14px;gap:14px;min-height:150px}
.sh-foot .bl{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.sh-foot .bl img{height:60px;border-radius:50%}
.sh-foot .bl b{font-size:22px;font-weight:900;color:var(--navy)}
.sh-foot ul{flex:1;margin:0;padding-left:20px;font-size:16px;font-weight:500;line-height:1.75}
.sh-foot .lg img{height:135px}

@media print{
  @page{margin:8mm}
  .noprint{display:none!important}
  body{background:#fff}.wrap{padding:0;max-width:none}
  .sheetbox{height:auto!important;overflow:visible}
  .scaler{transform:none!important;zoom:.72}
}
</style>
</head>
<body>
<div class="top noprint">
  <h1 id="appTitle"></h1>
  <button class="cloudbtn" id="cloud" hidden></button>
  <button class="cloudbtn" id="logout" hidden></button>
  <div class="lang"><button id="l-en">English</button><button id="l-ko">한국어</button></div>
</div>
<div id="login" hidden><div class="card login"><h2 id="lgTitle"></h2>
  <div class="row"><label id="lgIdL"></label><input type="text" value="admin" readonly style="background:#f0f3fa"></div>
  <div class="row"><label id="lgPwL"></label><input type="password" id="loginPw" autocomplete="current-password"></div>
  <p class="err" id="lgErr"></p><button class="btn pri" id="lgBtn"></button></div></div>
<div class="wrap">
  <div class="steps noprint" id="steps"></div>
  <div id="panel" class="noprint"></div>
  <div id="drawArea"></div>
</div>

async function authReq(path,method,body,token){
  const h={apikey:CFG.key,'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;
  const r=await fetch(base()+'/auth/v1/'+path,{method,headers:h,body:body?JSON.stringify(body):undefined});

  if(!r.ok){const e=new Error(j.msg||j.error_description||j.message||String(r.status));e.status=r.status;throw e}
  return j;
}
function setSession(j){session={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600)};try{localStorage.setItem(AUTH_KEY,JSON.stringify(session))}catch(e){}}
async function refreshSession(){if(!session)return false;try{setSession(await authReq('token?grant_type=refresh_token','POST',{refresh_token:session.refresh_token}));return true}catch(e){return false}}
async function ensureFresh(){if(session&&session.expires_at-Math.floor(Date.now()/1000)<60){if(!(await refreshSession())){logout();throw new Error('session expired')}}}

const adminEmail=()=>CFG.adminEmail||'admin@ontennis.app';
async function rest(path,opt={},retry=true){
  await ensureFresh();
  const h={apikey:CFG.key,'Content-Type':'application/json'};
  if(session)h.Authorization='Bearer '+session.access_token;
  else if(String(CFG.key).startsWith('eyJ'))h.Authorization='Bearer '+CFG.key;
  const r=await fetch(base()+'/rest/v1/'+path,{...opt,headers:{...h,...(opt.headers||{})}});
  if(r.status===401&&session&&retry){if(await refreshSession())return rest(path,opt,false);logout();throw new Error('unauthorized')}

  if(r.status===204)return null;
  const tx=await r.text();return tx?JSON.parse(tx):null;
}

const plRow=p=>({id:p.id,ko:p.ko,en:p.en,level:p.level,start_min:p.start,custom:!!p.custom,sel:!!p.sel});
async function pushState(){
  cloud.timer=null;if(!cloud.on)return;
  const settings={};SET_KEYS.forEach(k=>settings[k]=S[k]);

  if(sig===cloud.last)return;
  try{
    setCloud('sync');
    const up={Prefer:'resolution=merge-duplicates,return=minimal'};
    if(S.players.length){
      await rest('tennis_players?on_conflict=id',{method:'POST',headers:up,body:JSON.stringify(S.players.map(plRow))});

    }
    await rest('tennis_settings?on_conflict=key',{method:'POST',headers:up,body:JSON.stringify([{key:'app',value:settings,updated_at:new Date().toISOString()}])});

function cloudMatches(op){
  if(!cloud.on||!session)return Promise.resolve();
  cloud.n++;setCloud('sync');
  const p=cloud.q.then(op).then(()=>{cloud.n--;if(!cloud.n)setCloud('ok')},e=>{cloud.n--;console.warn('sync',e);setCloud('err')});

function buildSched(){
  const out=[];let t=S.startMin;
  while(t<S.endMin&&out.length<20){
    const len=t<300?S.roundLenA:S.roundLenB;
    if(t+len<=S.endMin){out.push({s:t,e:t+len});t+=len}
    else{const rem=S.endMin-t;if(rem>=15||!out.length)out.push({s:t,e:S.endMin});else out[out.length-1].e=S.endMin;break}
  }
  return out.length?out:[{s:S.startMin,e:S.startMin+S.roundLenA}];
}

/* ---------- generation ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function generate(){
  const sel=selPlayers().map(p=>p.id);
  const rated=sel.map(i=>byId(i).level).filter(v=>v>0),avgLv=rated.length?rated.reduce((a,b)=>a+b,0)/rated.length:3;
  const lv=id=>byId(id).level||avgLv;
  const sit={},pH={},oH={};sel.forEach(i=>sit[i]=0);
  const key=(a,b)=>a<b?a+'|'+b:b+'|'+a;
  const rounds=[];
  for(let r=0;r<S.nRounds;r++){
    const elig=sel.filter(id=>byId(id).start<=rStart(r));
    const layout=[];let remaining=elig.length;
    for(let c=0;c<S.nCourts;c++){
      if(!S.avail[r][c]){layout.push(null);continue}
      const ty=S.types[c],size=ty==='doubles'?4:2;
      if(remaining>=size){layout.push({c,type:ty,size});remaining-=size}
      else if(ty==='doubles'&&remaining>=2){layout.push({c,type:'singles',size:2});remaining-=2}
      else layout.push(null);
    }
    const nPlay=elig.length-remaining;
    let order=shuffle(elig);
    if(S.fair)order.sort((a,b)=>sit[b]-sit[a]);
    const playing=order.slice(0,nPlay),rest=order.slice(nPlay);
    const lm=S.levelMode;
    const singleCost=(a,b)=>{let x=(S.avoidOpp?(oH[key(a,b)]||0)*3:0),d=Math.abs(lv(a)-lv(b));if(lm==='on')x+=d*2;if(lm==='mix')x-=d*.5;return x};
    const dblCost=(a,b,c,d)=>{
      let x=0;
      if(S.rotate)x+=((pH[key(a,b)]||0)+(pH[key(c,d)]||0))*10;
      if(S.avoidOpp)x+=((oH[key(a,c)]||0)+(oH[key(a,d)]||0)+(oH[key(b,c)]||0)+(oH[key(b,d)]||0))*3;
      const df=Math.abs(lv(a)+lv(b)-lv(c)-lv(d));
      if(lm==='on')x+=df*2;if(lm==='mix')x-=df*.3;
      return x};
    let best=null,bestScore=Infinity;
    for(let it=0;it<250;it++){
      const p=shuffle(playing);let idx=0,total=0;const cs=[];
      for(const L of layout){
        if(!L){cs.push(null);continue}
        const g=p.slice(idx,idx+L.size);idx+=L.size;
        if(L.type==='singles'){total+=singleCost(g[0],g[1]);cs.push({type:'singles',teams:[[g[0]],[g[1]]]})}
        else{
          let bs=Infinity,bt=null;
          for(const [i,j,k,l] of [[0,1,2,3],[0,2,1,3],[0,3,1,2]]){
            const cst=dblCost(g[i],g[j],g[k],g[l]);
            if(cst<bs){bs=cst;bt=[[g[i],g[j]],[g[k],g[l]]]}
          }
          total+=bs;cs.push({type:'doubles',teams:bt});
        }
      }
      if(total<bestScore){bestScore=total;best=cs}
    }
    best.forEach(m=>{if(!m)return;
      const [A,B]=m.teams;
      if(A.length===2){pH[key(A[0],A[1])]=(pH[key(A[0],A[1])]||0)+1;pH[key(B[0],B[1])]=(pH[key(B[0],B[1])]||0)+1}
      A.forEach(a=>B.forEach(b=>oH[key(a,b)]=(oH[key(a,b)]||0)+1));
    });
    rest.forEach(i=>sit[i]++);
    rounds.push({courts:best,rest:elig.filter(i=>rest.includes(i))});
  }
  S.draw=rounds;S.scores={};S.drawId=String(Date.now());
}

/* ---------- ratings ---------- */
function ratingStats(id){
  const rc=S.rc,lvl=x=>{const p=byId(x);return p&&p.level?p.level:3};
  let ms=S.history.map((m,i)=>({...m,i})).filter(m=>m.a.includes(id)||m.b.includes(id));
  ms.sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.i-y.i);
  if(rc.mode==='last')ms=ms.slice(-rc.n);
  else if(rc.mode==='month')ms=ms.filter(m=>m.date.slice(0,7)===rc.month);
  else ms=ms.filter(m=>(!rc.from||m.date>=rc.from)&&(!rc.to||m.date<=rc.to));
  let w=0,l=0,gd=0,acc=0;
  ms.forEach(m=>{
    const mine=m.a.includes(id),own=mine?m.a:m.b,opp=mine?m.b:m.a,gf=mine?m.sa:m.sb,ga=mine?m.sb:m.sa;
    const avg=g=>g.reduce((s,x)=>s+lvl(x),0)/g.length;
    const exp=1/(1+Math.pow(10,-(avg(own)-avg(opp))/2));
    const win=gf>ga?1:gf<ga?0:.5,share=gf+ga?gf/(gf+ga):.5;
    if(gf>ga)w++;else if(gf<ga)l++;gd+=gf-ga;
    acc+=.5*(win-exp)+.5*(share-exp);
  });
  const n=ms.length,perf=n?acc/n:0,cur=byId(id).level;
  let sug=null;
  if(n>=rc.min){
    if(cur){sug=perf>=.15?Math.min(5,cur+.5):perf<=-.15?Math.max(1,cur-.5):cur}
    else sug=Math.max(1,Math.min(5,Math.round((3+perf*4)*2)/2));
  }
  return {n,w,l,gd,perf,sug};
}

    <div class="row"><label>${L.sheetTitle}</label><input type="text" value="${esc(S.title)}" placeholder="${L.drawTitle}" oninput="S.title=this.value"></div>
    <div class="row"><label>${L.club}</label><input type="text" value="${esc(S.club)}" oninput="S.club=this.value"></div>
    <div class="row" style="align-items:flex-start"><label>${L.notesLbl}</label><div style="flex:1;min-width:240px"><textarea id="notesTa" rows="5" style="width:100%;border:1px solid #b8c1d6;border-radius:8px;padding:8px 10px;font:inherit" oninput="setNotes(this.value)">${esc(notesFor().join('\n'))}</textarea><p class="hint" style="margin:4px 0 6px">${L.notesHint}</p><button class="btn" onclick="resetNotes()">${L.resetNotes}</button></div></div></div>
    ${cloud.on&&session?`<div class="card"><h2>${L.acct}</h2>
    <div class="row"><label>${L.pwCur}</label><input type="password" id="pwCur" autocomplete="current-password"></div>
    <div class="row"><label>${L.pwNew}</label><input type="password" id="pwNew" autocomplete="new-password"></div>
    <div class="row"><label>${L.pwNew2}</label><input type="password" id="pwNew2" autocomplete="new-password"></div>
    <div class="row"><button class="btn" onclick="changePw()">${L.pwChange}</button><span class="note" id="pwMsg"></span></div></div>`:''}`;
  }
  if(S.step===4){
    const rc=S.rc,rows=S.players.map(p=>{const q=ratingStats(p.id),ch=q.sug!=null&&q.sug!==p.level;
      return `<tr><td style="text-align:left">${esc(pname(p))}</td><td>${p.level||L.unrated}</td><td>${q.sug==null?`<span class="note">${L.noSug}</span>`:ch?`<b style="color:var(--acc)">${q.sug}</b>`:q.sug+' ✓'}</td><td>${q.n}</td><td>${q.w}-${q.l}</td><td>${q.gd>0?'+':''}${q.gd}</td><td>${ch?`<button class="btn" onclick="applyLv(${p.id},${q.sug})">${L.apply}</button>`:''}</td></tr>`}).join('');
    h=`<div class="card"><h2>${L.s5}</h2><p class="hint">${L.lvHint}</p>
    <div class="row"><label>${L.basis}</label>${seg([['last',L.bLast],['month',L.bMonth],['range',L.bRange]],rc.mode,`setRc.bind(null,\'mode\')`)}</div>
    ${rc.mode==='last'?`<div class="row"><label>${L.nMatchesLbl}</label>${stepper(rc.n,'setRcN(-1)','setRcN(1)')}</div>`:''}
    ${rc.mode==='month'?`<div class="row"><label>${L.monthLbl}</label><input type="month" value="${rc.month}" onchange="S.rc.month=this.value;renderPanel()"></div>`:''}
    ${rc.mode==='range'?`<div class="row"><label>${L.fromLbl}</label><input type="date" value="${rc.from}" onchange="S.rc.from=this.value;renderPanel()"><label style="min-width:auto">${L.toLbl}</label><input type="date" value="${rc.to}" onchange="S.rc.to=this.value;renderPanel()"></div>`:''}
    <div class="row"><label>${L.minM}</label>${stepper(rc.min,'setRcMin(-1)','setRcMin(1)')}</div>
    <div class="row"><label>${L.operatorLbl}</label><input type="text" value="${esc(S.operator)}" oninput="S.operator=this.value;save()"></div>
    <div class="row"><b>${L.histCount(S.history.length)}</b><button class="btn" onclick="addSample()">${L.sample}</button><button class="btn" onclick="exportData()">${L.exportJson}</button><button class="btn" onclick="clearHist()">${L.clearHist}</button></div></div>
    <div class="card"><div style="overflow:auto"><table class="st"><tr><th style="text-align:left">${L.pl}</th><th>${L.cur}</th><th>${L.sug}</th><th>${L.matches}</th><th>${L.wl}</th><th>${L.gd}</th><th></th></tr>${rows}</table></div>
    <div class="row" style="margin-top:12px"><button class="btn pri" onclick="applyAll()">${L.applyAll}</button><span class="note" id="applyMsg"></span></div></div>
    <div class="card"><h2>${L.levelLog}</h2>${S.levelLog.length?`<div style="overflow:auto"><table class="st"><tr><th>${L.dateLbl}</th><th style="text-align:left">${L.pl}</th><th>${L.lvFrom}</th><th>${L.cur}</th><th></th><th>${L.operatorLbl}</th></tr>${S.levelLog.slice(0,30).map(x=>`<tr><td>${esc(x.date||'')}</td><td style="text-align:left">${esc(S.lang==='ko'?x.ko:x.en)}</td><td>${x.old||L.unrated}</td><td><b>${x.nw}</b></td><td>${x.src==='suggestion'?L.suggestion:L.manual}</td><td>${esc(x.by||'')}</td></tr>`).join('')}</table></div>`:`<p class="hint">${L.noLog}</p>`}</div>`;
  }
  if(S.step<3){
    h+=`<div class="nav">${S.step>0?`<button class="btn" onclick="go(${S.step-1})">${L.back}</button>`:'<span></span>'}
    ${S.step<2?`<button class="btn pri" onclick="go(${S.step+1})">${L.next}</button>`:`<button class="btn pri" onclick="doGen()">${L.gen}</button>`}</div><p class="err" id="err"></p>`;
  }
  $('#panel').innerHTML=h;
}
function renderDraw(){
  const L=t(),el=$('#drawArea');
  if(S.step!==3||!S.draw){el.innerHTML='';return}
  el.innerHTML=`<div class="row noprint"><button class="btn" onclick="go(2)">${L.back}</button><button class="btn" onclick="doGen()">${L.shuffle}</button><button class="btn pri" onclick="dlPdf()" id="pdfBtn">${L.pdf}</button><button class="btn" onclick="window.print()">${L.print}</button></div>
  <div class="row noprint"><label style="min-width:auto">${L.dateLbl}</label><input type="date" value="${S.saveDate}" onchange="S.saveDate=this.value;save();autoSave()"><span id="saveMsg" class="note">${L.autoSaved}</span></div>
  <div class="sheetbox" id="sheetbox"><div class="scaler" id="scaler">${sheetHTML()}</div></div>
  <div class="card noprint" id="drawListCard"><h2>${L.savedDraws}</h2><div id="drawList"></div></div>
  <div class="card noprint"><h2>${L.stand}</h2><p class="hint">${L.standHint}</p><div id="stand">${standingsHTML()}</div></div>`;
  renderDrawList();fitNames();fitSheet();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{fitNames();fitSheet()});
}
function renderDrawList(){
  const el=$('#drawList');if(!el)return;const L=t();
  el.innerHTML=S.draws.length?`<table class="st"><tr><th>${L.dateLbl}</th><th style="text-align:left">${L.savedDraws}</th><th></th></tr>${S.draws.map(d=>{const sn=d.data.snap||{};return `<tr><td>${esc(d.played_on)}</td><td style="text-align:left">${L.drawInfo(sn.nCourts,sn.nRounds,(sn.part||[]).length)}${String(d.sid)===String(S.drawId)?' ●':''}</td><td><button class="btn" onclick="openDraw('${esc(d.sid)}')">${L.openDraw}</button></td></tr>`}).join('')}</table>`:'';
}
function openDraw(sid){
  const d=S.draws.find(x=>String(x.sid)===String(sid));if(!d)return;
  const sn=d.data.snap;
  Object.entries(sn.names||{}).forEach(([id,n])=>{if(!byId(+id))S.players.push({id:+id,ko:n[0],en:n[1],level:0,sel:false,start:300,custom:true})});
  S.players.forEach(p=>p.sel=(sn.part||[]).includes(p.id));
  ['nCourts','nRounds','sched','scoring','games','club','title'].forEach(k=>{if(sn[k]!==undefined)S[k]=sn[k]});
  S.draw=d.data.rounds;S.scores=d.data.scores||{};S.drawId=String(d.sid);S.saveDate=d.played_on;S.step=3;renderAll();window.scrollTo({top:0});
}
function renderAll(){
  save();updateCloudUI();applyGate();
  document.documentElement.lang=S.lang;
  $('#appTitle').textContent=t().app;
  $('#l-en').classList.toggle('on',S.lang==='en');$('#l-ko').classList.toggle('on',S.lang==='ko');
  renderSteps();renderPanel();renderDraw();
}

/* ---------- actions ---------- */
function go(i){S.step=i;if(i===3&&!S.draw){if(!doGen())return}renderAll();window.scrollTo({top:0})}
function doGen(){
  const L=t();
  if(selPlayers().length<2){S.step=0;renderAll();$('#err').textContent=L.needPlayers;return false}
  if(!Array.from({length:S.nRounds},(_,r)=>capacity(r)).some(x=>x>0)){S.step=1;renderAll();$('#err').textContent=L.needCourts;return false}
  generate();S.step=3;renderAll();pushDraw();window.scrollTo({top:0});return true;
}
function setStart(id,v){byId(id).start=+v;S.draw=null;save();renderPanel()}
function setSessionStart(v){S.startMin=+v;recompute();S.draw=null;renderPanel()}
function setEnd(v){S.endMin=+v;recompute();S.draw=null;renderPanel()}
function setLenA(v){S.roundLenA=+v;recompute();S.draw=null;renderPanel()}
function setLenB(v){S.roundLenB=+v;recompute();S.draw=null;renderPanel()}
function applyLv(id,v){const p=byId(id);logLevel(p,p.level,v,'suggestion');p.level=v;S.draw=null;renderAll()}
function applyAll(){let n=0;S.players.forEach(p=>{const q=ratingStats(p.id);if(q.sug!=null&&q.sug!==p.level){logLevel(p,p.level,q.sug,'suggestion');p.level=q.sug;n++}});S.draw=null;renderAll();const m=$('#applyMsg');if(m)m.textContent=t().applied(n)}
function setRc(k,v){S.rc[k]=v;renderPanel()}
function setRcN(d){S.rc.n=Math.max(1,Math.min(100,S.rc.n+d));renderPanel()}
function setRcMin(d){S.rc.min=Math.max(1,Math.min(30,S.rc.min+d));renderPanel()}
let _autoT=null;
function autoSave(){clearTimeout(_autoT);_autoT=setTimeout(saveResults,700)}
function saveResults(){
  if(!S.draw)return;
  const sid=String(S.drawId),out=[];
  S.draw.forEach((rd,r)=>rd.courts.forEach((m,c)=>{const v=S.scores[r+'-'+c];if(!m||!v||v[0]===''||v[1]==='')return;
    out.push({sid,date:S.saveDate,r,c,type:m.type,a:m.teams[0],b:m.teams[1],sa:+v[0],sb:+v[1]})}));
  S.history=S.history.filter(h=>String(h.sid)!==sid).concat(out);save();
  const msg=$('#saveMsg');if(msg)msg.textContent=t().autoSaved+' ('+out.length+')';
  cloudMatches(async()=>{await rest('tennis_matches?sid=eq.'+encodeURIComponent(sid),{method:'DELETE'});if(out.length)await rest('tennis_matches',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(out.map(mRow))})});
  pushDraw();
}
function addSample(){
  const ids=S.players.map(p=>p.id),lvl=x=>byId(x).level||3;let k=0;
  for(let i=0;i<40;i++){
    const g=shuffle(ids).slice(0,4),a=g.slice(0,2),b=g.slice(2),d=new Date(Date.now()-Math.floor(Math.random()*60)*864e5).toISOString().slice(0,10);
    const pa=1/(1+Math.pow(10,-((lvl(a[0])+lvl(a[1]))-(lvl(b[0])+lvl(b[1])))/4));
    const aw=Math.random()<pa,lo=Math.floor(Math.random()*5);
    S.history.push({sid:'s'+Date.now()+i,date:d,r:0,c:0,type:'doubles',a,b,sa:aw?6:lo,sb:aw?lo:6});k++;
  }
  save();renderPanel();
  const add=S.history.slice(-40);
  cloudMatches(()=>rest('tennis_matches',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(add.map(mRow))}));
}
function clearHist(){if(confirm(t().confirmClear)){S.history=[];save();renderPanel();cloudMatches(()=>rest('tennis_matches?sid=neq.__none__',{method:'DELETE'}))}}
function exportData(){const b=new Blob([JSON.stringify({players:S.players,history:S.history},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tennis-data.json';a.click()}
function togP(id){const p=byId(id);p.sel=!p.sel;S.draw=null;renderAll()}
function selAll(v){const q=UI.plQuery.trim().toLowerCase();S.players.forEach(p=>{if(!q||(p.ko||'').toLowerCase().includes(q)||(p.en||'').toLowerCase().includes(q))p.sel=v});S.draw=null;renderAll()}
function setLv(id,v){const p=byId(id);logLevel(p,p.level,+v,'manual');p.level=+v;S.draw=null;save()}
function delP(id){S.players=S.players.filter(p=>p.id!==id);S.draw=null;renderAll()}
function editP(id){const p=byId(id),L=t();const k=prompt(L.editKo,p.ko);if(k===null)return;const e=prompt(L.editEn,p.en);if(e===null)return;p.ko=k.trim()||e.trim()||p.ko;p.en=e.trim()||k.trim()||p.en;S.draw=null;renderAll()}
function addP(){const k=$('#newKo').value.trim(),e=$('#newEn').value.trim();if(!k&&!e)return;S.players.push({id:Date.now(),ko:k||e,en:e||k,level:+$('#newLv').value,sel:true,start:300,custom:true});S.draw=null;renderAll()}
function setCourts(d){S.nCourts=Math.max(1,Math.min(4,S.nCourts+d));S.draw=null;renderAll()}
function setRounds(d){S.nRounds=Math.max(1,Math.min(12,S.nRounds+d));S.draw=null;renderAll()}
function setType(c,v){S.types[c]=v;S.draw=null;renderAll()}
function togA(r,c){S.avail[r][c]=!S.avail[r][c];S.draw=null;renderPanel()}
function setF(k,v){S[k]=v;S.draw=null;renderPanel()}
function setNotes(v){S.notesCustom[S.lang]=v.split('\n').map(x=>x.trim()).filter(Boolean)}
function resetNotes(){S.notesCustom[S.lang]=null;renderPanel()}
function setGames(d){S.games=Math.max(1,Math.min(12,S.games+d));S.draw=null;renderPanel()}
function togF(k){S[k]=!S[k];S.draw=null;renderPanel()}

document.addEventListener('input',e=>{
  const i=e.target;if(!i.dataset||i.dataset.k===undefined)return;
  i.value=i.value.replace(/\D/g,'');
  const v=S.scores[i.dataset.k]||['',''];v[+i.dataset.i]=i.value;S.scores[i.dataset.k]=v;
  $('#stand').innerHTML=standingsHTML();
  autoSave();
});
document.addEventListener('input',()=>save());
$('#l-en').onclick=()=>{S.lang='en';renderAll()};
$('#l-ko').onclick=()=>{S.lang='ko';renderAll()};
window.addEventListener('resize',fitSheet);

async function dlPdf(){
  const btn=$('#pdfBtn'),L=t(),sc=$('#scaler'),el=$('#sheet');
  btn.textContent=L.makingPdf;
  const prev=sc.style.transform;sc.style.transform='none';
  try{
    await document.fonts.ready;
    // inputs render fine in html2canvas; empty ones show as blank boxes
    await html2pdf().set({margin:0,filename:L.file,image:{type:'jpeg',quality:.98},
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},
      jsPDF:{unit:'px',format:[el.offsetWidth+2,el.offsetHeight+2],orientation:'portrait',hotfixes:['px_scaling']}}).from(el).save();
  }catch(e){alert(L.pdfFail)}
  sc.style.transform=prev;fitSheet();btn.textContent=L.pdf;
}
renderAll();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
document.getElementById('cloud').onclick=()=>{if(cloud.on&&session){cloud.busy=false;pushState().then(pull)}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloud.on&&session&&!cloud.timer)pull()});
document.getElementById('lgBtn').onclick=doLogin;
document.getElementById('loginPw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
document.getElementById('logout').onclick=logout;
applyGate();
if(cloud.on&&session)pull();
</script>
</body>
</html>
